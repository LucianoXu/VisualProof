# A release (CONTRIBUTING.md, "Branches and releases"): the owner pushes a tag `vX.Y.Z`, or
# `vX.Y.Z-rc.N` for a release candidate, on a commit of main. The tag is checked against
# package.json, CITATION.cff and CHANGELOG.md; the commit is the one main tested as the merge
# landed (test.yml's checks on it passed), else the suite runs here; the package is published to npm
# with provenance (a release candidate under the `next` tag, so that `npm install visualproof`
# never gets it), and the GitHub release is made from the changelog's section for the version.
# Nothing here runs for anything but such a tag, and `"private": true` in package.json makes
# `npm publish` refuse until the first release takes it out.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      next: ${{ steps.v.outputs.next }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        name: The tag, package.json, CITATION.cff and CHANGELOG.md say the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          cff="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' CITATION.cff)"
          [ "$tag" = "$pkg" ] || { echo "::error::the tag says $tag, package.json $pkg"; exit 1; }
          [ "$tag" = "$cff" ] || { echo "::error::the tag says $tag, CITATION.cff $cff"; exit 1; }
          grep -Eq "^## .*\b${tag//./\\.}\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-rc.*) echo "next=true" >> "$GITHUB_OUTPUT" ;; *) echo "next=false" >> "$GITHUB_OUTPUT" ;; esac

  # the tagged commit was tested on main as it landed (test.yml, on push to main): the six checks main
  # requires, passed on this very commit, are enough, waited for while they run. A commit with none
  # of them done (a run cancelled by a later push) is tested below; one that failed is not released.
  verify:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      contents: read
    outputs:
      tested: ${{ steps.v.outputs.tested }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          need='["test (ubuntu-latest, 24)","test (ubuntu-latest, 22.18.0)","test (macos-latest, 24)","package (ubuntu-latest, 24)","package (ubuntu-latest, 22.18.0)","package (macos-latest, 24)"]'
          for i in $(seq 1 80); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > runs.json
            # each required check's latest run on this commit: passed, failed, running, or none
            state=$(jq -r --argjson need "$need" '
              [ $need[] as $n | ([.check_runs[] | select(.name == $n)] | max_by(.id)) ]
              | map(if . == null then "none" elif .status != "completed" then "running"
                    elif .conclusion == "success" then "passed"
                    elif .conclusion == "cancelled" or .conclusion == "skipped" then "none"
                    else "failed" end)
              | if all(. == "passed") then "passed" elif any(. == "failed") then "failed"
                elif any(. == "running") then "running" else "none" end' runs.json)
            echo "the required checks on $GITHUB_SHA: $state"
            case "$state" in
              passed) echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              failed) echo "::error::a check main requires failed on this commit"; exit 1 ;;
              running) sleep 30 ;;
              *) break ;;
            esac
          done
          echo "tested=false" >> "$GITHUB_OUTPUT"

  # the suite as test.yml runs it, on the tagged commit, where main's checks did not test it
  test:
    needs: verify
    if: needs.verify.outputs.tested != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - if: runner.os == 'macOS'
        run: brew install poppler
      - run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat test/fixture/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: [check, verify, test]
    # the test job is skipped where main's checks tested the commit
    if: always() && needs.check.result == 'success' && needs.verify.result == 'success' && (needs.verify.outputs.tested == 'true' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      # npm's trusted publishing (OIDC), which also signs the provenance
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@11
      - run: npm ci
      # prepack builds dist/
      - name: Publish to npm
        run: npm publish --provenance --access public ${{ needs.check.outputs.next == 'true' && '--tag next' || '' }}
      - name: The GitHub release, from the changelog
        run: |
          v="${{ needs.check.outputs.version }}"
          awk -v v="$v" 'BEGIN { re = v; gsub(/\./, "\\.", re) } /^## / { if (on) exit; if ($0 ~ re) { on = 1; next } } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "VisualProof $v" --notes-file notes.md ${{ needs.check.outputs.next == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
